<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="stage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#3F2A0A"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="podium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="score" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>
  <!-- Stars -->
  <g fill="#FFF" opacity="0.5">
    <circle cx="40" cy="30" r="0.7"/>
    <circle cx="200" cy="40" r="0.6"/>
    <circle cx="420" cy="25" r="1.0"/>
    <circle cx="560" cy="50" r="0.7"/>
  </g>
  <!-- The stage -->
  <g transform="translate(0, 200)">
    <rect x="0" y="0" width="640" height="120" fill="url(#stage)"/>
    <!-- Stage edge -->
    <rect x="0" y="0" width="640" height="3" fill="#FBBF24"/>
  </g>
  <!-- Curtains on either side -->
  <g transform="translate(0, 0)">
    <path d="M 0 0 L 30 0 Q 50 100 30 200 L 0 200 Z" fill="url(#curtain)"/>
    <path d="M 640 0 L 610 0 Q 590 100 610 200 L 640 200 Z" fill="url(#curtain)"/>
  </g>
  <!-- The conductor's podium in the center-front -->
  <g transform="translate(290, 165)">
    <!-- Podium base -->
    <rect x="0" y="20" width="60" height="30" fill="url(#podium)" stroke="#3F2A0A" stroke-width="1"/>
    <!-- Music stand -->
    <rect x="20" y="-20" width="40" height="50" rx="2" fill="url(#score)" stroke="#92400E" stroke-width="1"/>
    <line x1="25" y1="-10" x2="55" y2="-10" stroke="#3F2A0A" stroke-width="0.4"/>
    <line x1="25" y1="-2" x2="55" y2="-2" stroke="#3F2A0A" stroke-width="0.4"/>
    <line x1="25" y1="6" x2="55" y2="6" stroke="#3F2A0A" stroke-width="0.4"/>
    <line x1="25" y1="14" x2="55" y2="14" stroke="#3F2A0A" stroke-width="0.4"/>
    <line x1="25" y1="22" x2="55" y2="22" stroke="#3F2A0A" stroke-width="0.4"/>
    <text x="40" y="-23" text-anchor="middle" fill="#3F2A0A" font-family="ui-sans-serif,system-ui" font-size="6" font-weight="bold">WILSON + LINUCB</text>
  </g>
  <!-- The orchestra avatars (model seats) -->
  <g transform="translate(50, 130)">
    <!-- PHI-4 -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="20" r="14" fill="url(#score)" stroke="#92400E" stroke-width="1"/>
      <text x="20" y="24" text-anchor="middle" fill="#3F2A0A" font-family="ui-monospace,monospace" font-size="8" font-weight="bold">PHI-4</text>
      <text x="20" y="50" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">math</text>
    </g>
    <!-- HERMES_405B -->
    <g transform="translate(50, -10)">
      <circle cx="20" cy="20" r="14" fill="url(#score)" stroke="#92400E" stroke-width="1"/>
      <text x="20" y="24" text-anchor="middle" fill="#3F2A0A" font-family="ui-monospace,monospace" font-size="6" font-weight="bold">HERMES</text>
      <text x="20" y="50" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">voice</text>
    </g>
    <!-- SEED_MINI -->
    <g transform="translate(100, 0)">
      <circle cx="20" cy="20" r="14" fill="url(#score)" stroke="#92400E" stroke-width="1"/>
      <text x="20" y="24" text-anchor="middle" fill="#3F2A0A" font-family="ui-monospace,monospace" font-size="6" font-weight="bold">SEED</text>
      <text x="20" y="50" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">creative</text>
    </g>
    <!-- QWEN_0_5B -->
    <g transform="translate(150, -10)">
      <circle cx="20" cy="20" r="14" fill="url(#score)" stroke="#92400E" stroke-width="1"/>
      <text x="20" y="24" text-anchor="middle" fill="#3F2A0A" font-family="ui-monospace,monospace" font-size="6" font-weight="bold">QWEN</text>
      <text x="20" y="50" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">local</text>
    </g>
  </g>
  <!-- Weather icons above -->
  <g transform="translate(50, 30)">
    <text x="0" y="0" fill="#A5B4FC" font-family="ui-sans-serif,system-ui" font-size="9" font-weight="bold">weather</text>
    <g transform="translate(0, 8)">
      <circle cx="10" cy="10" r="8" fill="#FBBF24"/>
      <text x="10" y="32" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">calm</text>
    </g>
    <g transform="translate(28, 8)">
      <path d="M 5 12 Q 12 4 19 12" fill="none" stroke="#A5B4FC" stroke-width="1.5"/>
      <text x="12" y="32" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">windy</text>
    </g>
    <g transform="translate(56, 8)">
      <path d="M 0 6 Q 12 0 24 6" fill="none" stroke="#EF4444" stroke-width="2"/>
      <path d="M 0 12 Q 12 6 24 12" fill="none" stroke="#EF4444" stroke-width="2"/>
      <text x="12" y="32" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace,monospace" font-size="6">gale</text>
    </g>
    <g transform="translate(84, 8)">
      <path d="M 4 4 L 20 20 M 20 4 L 4 20" stroke="#7C3AED" stroke-width="2"/>
      <text x="12" y="32" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace,monospace" font-size="6">storm</text>
    </g>
  </g>
  <!-- Battery gauge -->
  <g transform="translate(170, 30)">
    <text x="0" y="0" fill="#A5B4FC" font-family="ui-sans-serif,system-ui" font-size="9" font-weight="bold">battery</text>
    <rect x="0" y="6" width="60" height="20" rx="2" fill="none" stroke="#A5B4FC" stroke-width="1"/>
    <rect x="2" y="8" width="50" height="16" fill="url(#bar1)"/>
    <rect x="60" y="11" width="4" height="10" fill="#A5B4FC"/>
    <text x="30" y="20" text-anchor="middle" fill="#FFF" font-family="ui-monospace,monospace" font-size="8" font-weight="bold">83%</text>
  </g>
  <!-- Wilson + LinUCB chart on the right -->
  <g transform="translate(420, 30)">
    <rect x="0" y="0" width="200" height="160" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#FFF" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="bold">Wilson + LinUCB blend</text>
    <!-- 4 bars -->
    <g>
      <rect x="20" y="120" width="20" height="20" fill="url(#bar1)" filter="url(#glow)"/>
      <text x="30" y="115" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="8">0.9</text>
    </g>
    <g>
      <rect x="60" y="100" width="20" height="40" fill="url(#bar1)" filter="url(#glow)"/>
      <text x="70" y="95" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="8">0.7</text>
    </g>
    <g>
      <rect x="100" y="80" width="20" height="60" fill="url(#bar1)" filter="url(#glow)"/>
      <text x="110" y="75" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="8">0.5</text>
    </g>
    <g>
      <rect x="140" y="40" width="20" height="100" fill="url(#bar1)" filter="url(#glow)"/>
      <text x="150" y="35" text-anchor="middle" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="8">0.3</text>
    </g>
    <!-- n axis labels -->
    <text x="30" y="150" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">n=1</text>
    <text x="70" y="150" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">n=5</text>
    <text x="110" y="150" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">n=15</text>
    <text x="150" y="150" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace,monospace" font-size="6">n=25</text>
  </g>
  <!-- Title -->
  <text x="320" y="305" text-anchor="middle" fill="#FBBF24" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="600" letter-spacing="0.05em">THE CASTING DIRECTOR · THE ORCHESTRA · THE CASTING</text>
</svg>
